apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsecure
  labels:
    app: shopsecure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsecure
  template:
    metadata:
      labels:
        app: shopsecure
    spec:
      containers:
        - name: shopsecure
          image: mo5taryan/shopsecure:develop
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20